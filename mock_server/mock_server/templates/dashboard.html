<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seeker Mock Server</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1b1f23;
    --border: #2a2f34;
    --text: #d7dadd;
    --text-dim: #868e96;
    --accent: #4fb3bf;
    --ok: #4caf7d;
    --warn: #d99a3d;
    --err: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", "Roboto Mono", "SFMono-Regular", Consolas, monospace;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .meta {
    color: var(--text-dim);
    font-size: 12px;
  }
  main {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 16px;
    padding: 16px 20px;
    height: calc(100% - 50px);
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  section.panel > .panel-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  section.panel > .panel-head h2 {
    font-size: 12px;
    font-weight: 600;
    margin: 0;
    color: var(--text-dim);
  }
  section.panel > .panel-body {
    overflow-y: auto;
    flex: 1;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 11px;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  td.path { color: var(--accent); }
  td.fixture { color: var(--text-dim); max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .delay-input {
    width: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 6px;
    border-radius: 3px;
    font: inherit;
  }
  button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 3px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .status { font-weight: 600; }
  .status-2 { color: var(--ok); }
  .status-4 { color: var(--warn); }
  .status-5 { color: var(--err); }
  .log-row { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .log-row .top { display: flex; justify-content: space-between; }
  .log-row .path { color: var(--accent); }
  .log-row .ts { color: var(--text-dim); }
  #preview {
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    max-height: 80px;
    overflow: auto;
  }
  .empty { color: var(--text-dim); padding: 14px; }
</style>
</head>
<body>
<header>
  <h1>Seeker Mock Server</h1>
  <span class="meta" id="route-count">— routes</span>
</header>
<main>
  <section class="panel">
    <div class="panel-head"><h2>routes</h2></div>
    <div class="panel-body">
      <table id="routes-table">
        <thead>
          <tr><th>vendor</th><th>path</th><th>fixture</th><th>type</th><th>delay ms</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <h2>request log</h2>
      <button id="clear-log">clear</button>
    </div>
    <div class="panel-body" id="log-body">
      <div class="empty">no requests yet — hit a route above or run a collector against this server</div>
    </div>
  </section>
</main>

<script>
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  return res.json();
}

function statusClass(status) {
  return "status status-" + String(status)[0];
}

async function renderRoutes() {
  const routes = await fetchJSON("/_dashboard/api/routes");
  document.getElementById("route-count").textContent = routes.length + " route" + (routes.length === 1 ? "" : "s");
  const tbody = document.querySelector("#routes-table tbody");
  tbody.innerHTML = "";
  for (const r of routes) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.vendor}</td>
      <td class="path">${r.path}</td>
      <td class="fixture" title="${r.fixture}">${r.fixture}</td>
      <td>${r.content_type}</td>
      <td><input class="delay-input" type="number" min="0" step="50" value="${r.delay_ms}"></td>
      <td><button class="test-btn">test</button></td>
    `;
    const input = tr.querySelector(".delay-input");
    input.addEventListener("change", async () => {
      await fetchJSON(`/_dashboard/api/routes${r.path}/delay`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ delay_ms: Number(input.value) }),
      });
    });
    tr.querySelector(".test-btn").addEventListener("click", async () => {
      const res = await fetch(r.path);
      const text = await res.text();
      let existing = tr.querySelector("#preview");
      if (existing) existing.remove();
      const cell = document.createElement("tr");
      const preview = document.createElement("td");
      preview.colSpan = 6;
      preview.id = "preview";
      preview.textContent = `[${res.status}] ` + text.slice(0, 400);
      cell.appendChild(preview);
      tr.after(cell);
      renderLog();
    });
    tbody.appendChild(tr);
  }
}

async function renderLog() {
  const entries = await fetchJSON("/_dashboard/api/log");
  const body = document.getElementById("log-body");
  if (entries.length === 0) {
    body.innerHTML = '<div class="empty">no requests yet — hit a route above or run a collector against this server</div>';
    return;
  }
  body.innerHTML = "";
  for (const e of entries) {
    const row = document.createElement("div");
    row.className = "log-row";
    row.innerHTML = `
      <div class="top">
        <span class="path">${e.method} ${e.path}</span>
        <span class="${statusClass(e.status)}">${e.status}</span>
      </div>
      <div class="ts">${e.timestamp} · ${e.duration_ms}ms · ${e.vendor || ""}</div>
    `;
    body.appendChild(row);
  }
}

document.getElementById("clear-log").addEventListener("click", async () => {
  await fetchJSON("/_dashboard/api/log/clear", { method: "POST" });
  renderLog();
});

renderRoutes();
renderLog();
setInterval(renderLog, 1000);
</script>
</body>
</html>
